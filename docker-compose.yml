services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      MYNOTE_PASSWORD: ${MYNOTE_PASSWORD:?set MYNOTE_PASSWORD in .env}
      MYNOTE_DATA_DIR: /data
      MYNOTE_PORT: 8787
      MYNOTE_ORIGIN: ${MYNOTE_ORIGIN:-http://localhost:8080}
      MYNOTE_COOKIE_SECURE: ${MYNOTE_COOKIE_SECURE:-false}
      S3_BACKUP_ENABLED: ${S3_BACKUP_ENABLED:-false}
      S3_BACKUP_CONCURRENCY: ${S3_BACKUP_CONCURRENCY:-8}
      S3_BACKUP_DEBOUNCE_SECONDS: ${S3_BACKUP_DEBOUNCE_SECONDS:-60}
      S3_BACKUP_MAX_WAIT_SECONDS: ${S3_BACKUP_MAX_WAIT_SECONDS:-600}
      S3_BACKUP_SCHEDULE_ENABLED: ${S3_BACKUP_SCHEDULE_ENABLED:-false}
      S3_BACKUP_ENDPOINT: ${S3_BACKUP_ENDPOINT:-}
      S3_BACKUP_REGION: ${S3_BACKUP_REGION:-ap-guangzhou}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID:-}
      S3_BACKUP_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY:-}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-mynote}
      S3_BACKUP_RETENTION: ${S3_BACKUP_RETENTION:-30}
      S3_BACKUP_VERIFY_INTERVAL_HOURS: ${S3_BACKUP_VERIFY_INTERVAL_HOURS:-168}
      S3_BACKUP_INTERVAL_HOURS: ${S3_BACKUP_INTERVAL_HOURS:-24}
      S3_BACKUP_FORCE_PATH_STYLE: ${S3_BACKUP_FORCE_PATH_STYLE:-false}
      S3_BACKUP_SERVER_SIDE_ENCRYPTION: ${S3_BACKUP_SERVER_SIDE_ENCRYPTION:-AES256}
      S3_BACKUP_KMS_KEY_ID: ${S3_BACKUP_KMS_KEY_ID:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/data
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${MYNOTE_WEB_PORT:-8080}:80"
