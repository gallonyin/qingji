[package]
name = "mynote"
version = "0.1.0"
description = "Private, file-first Markdown notes"
authors = ["Qingji contributors"]
edition = "2021"

[lib]
name = "mynote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
